[Service]
Restart=no
TimeoutStartSec=900
RestartSec=10

WorkingDirectory=%E/containers/systemd

Environment=VOLUMES_DIR=%E/containers/volumes
Environment=MEDIA_DIR=%E/containers/media

Environment=DOMAIN=
Environment=IP_ADDRESS=

[Container]
#NoNewPrivileges=true
#DropCapability=all

#UserNS=keep-id:uid=65534,gid=65534
#User=65534:65534

#UserNS=auto
#ReadOnly=true
Pull=newer

[Install]
WantedBy=default.target
